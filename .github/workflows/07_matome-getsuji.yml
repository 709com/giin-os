name: 文京区まとめ 月次処理（毎月1日）
on:
  schedule:
    - cron: "20 22 1 * *"   # 日本時間 毎月1日 7:20
  workflow_dispatch:
jobs:
  monthly:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 lxml anthropic google-auth requests-oauthlib pynacl
      - run: PYTHONPATH=automation python -m matome.monthly
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - run: |
          git config user.name "giin-os-bot" && git config user.email "bot@local"
          git add matome/ && git commit -m "matome monthly $(TZ=Asia/Tokyo date +%F)" || true
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
